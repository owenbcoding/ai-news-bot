services:
  ai-news-bot:
    build: .
    container_name: ai-news-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Persist archive and dedupe state in the mounted volume
      - AI_ARCHIVE_PATH=/app/state/ai_news_archive.jsonl
      - AI_DEDUPE_INDEX_PATH=/app/state/ai_news_dedupe_index.json
    volumes:
      - ai_news_bot_state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ai_news_bot_state:

